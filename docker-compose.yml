services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: causeway
      POSTGRES_PASSWORD: causeway
      POSTGRES_DB: causeway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causeway -d causeway"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 20
  
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -retentionPeriod=14d
      - -httpListenAddr=:8428
    ports:
      - "8428:8428"

  causeway-api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP: redpanda:9092
      VM_URL: http://victoria-metrics:8428
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  causeway-worker:
    build: .
    command: python -m worker.main
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      VM_URL: http://victoria-metrics:8428
      DETECT_LATENCY_MS: "200"
      DETECH_INTERNAL_SEC: "15"
      DATABASE_URL_SYNC: postgres://causeway:causeway@postgres:5432/causeway
      CORR_WINDOW_SEC: "30"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      victoria-metrics:
        condition: service_started

  frontend:
    build: ./meshgen
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: frontend
      DOWNSTREAMS: "cart-svc:8080,checkout-svc:8080,catalog-svc:8080,search-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      cart-svc:
        condition: service_started
      checkout-svc:
        condition: service_started
      catalog-svc:
        condition: service_started
      search-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  cart-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: cart-svc
      DOWNSTREAMS: "inventory-svc:8080,pricing-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      inventory-svc:
        condition: service_started
      pricing-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  checkout-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: checkout-svc
      DOWNSTREAMS: "payment-svc:8080,order-svc:8080,inventory-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      payment-svc:
        condition: service_started
      order-svc:
        condition: service_started
      inventory-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  catalog-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: catalog-svc
      DOWNSTREAMS: "inventory-svc:8080,pricing-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      inventory-svc:
        condition: service_started
      pricing-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  search-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: search-svc
      DOWNSTREAMS: "catalog-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      catalog-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  payment-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: payment-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8081:8080"
    depends_on:
      otel-collector:
        condition: service_started

  order-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: order-svc
      DOWNSTREAMS: "notification-svc:8080"
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      notification-svc:
        condition: service_started
      otel-collector:
        condition: service_started

  inventory-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: inventory-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  pricing-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: pricing-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  notification-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: notification-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  auth-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: auth-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  config-svc:
    image: causeway-meshgen:local
    environment:
      SERVICE_NAME: config-svc
      DOWNSTREAMS: ""
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/gateway.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - victoria-metrics 

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"

  vmalert:
    image: victoriametrics/vmalert:v1.106.1
    volumes:
      - ./deploy/vmalert/rules.yaml:/etc/vmalert/rules.yaml:ro
    command:
      - -rule=/etc/vmalert/rules.yaml
      - -datasource.url=http://victoria-metrics:8428
      - -remoteWrite.url=http://victoria-metrics:8428
      - -remoteRead.url=http://victoria-metrics:8428
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=15s
    depends_on:
      - victoria-metrics
      - alertmanager
      - causeway-api
    ports: 
      - "8880:8880"


  
volumes:
  pgdata: