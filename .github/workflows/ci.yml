name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: |
          pytest narrator/test_validate.py \
            detectors/test_detectors.py \
            detectors/test_saturation_fault.py \
            correlator/test_dedupe.py \
            actions/test_policy.py -v
