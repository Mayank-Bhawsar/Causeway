name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: |
          pytest api/test_auth.py \
            narrator/test_validate.py \
            detectors/test_detectors.py \
            detectors/test_saturation_fault.py \
            correlator/test_dedupe.py \
            correlator/test_partition.py \
            actions/test_policy.py \
            localiser/test_blame_weights.py \
            bench/test_replay_dedupe.py \
            bench/test_deploy_fixture.py -v

  bench-rca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Bench replay (RCA regression)
        run: make bench
