route:
  receiver: causeway
  group_by: ["alertname", "service_name"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: causeway
    webhook_configs:
      - url: http://causeway-api:8000/ingest/alerts
        send_resolved: false
        # When INGEST_API_KEY is set on causeway-api, uncomment and set credentials:
        # http_config:
        #   authorization:
        #     type: Bearer
        #     credentials: "<same-as-INGEST_API_KEY>"